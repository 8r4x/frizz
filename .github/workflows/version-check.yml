name: version-check

# Fails on plugin version drift across every version-bearing file.
# Bump with `node scripts/set-version.ts <version>`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Check plugin version sync
        run: node scripts/set-version.ts --check
      - name: Check portable monitor copies
        run: node scripts/sync-portable-monitors.mjs --check
      - name: Test portable monitors
        run: node --test monitors/*.test.mjs
