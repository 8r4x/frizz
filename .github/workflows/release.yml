name: release

# Publishes `frizz` from the `release` branch — NOT from main.
#
# WHAT CHANGED, AND WHY (2026-09-08). This published on every push to main that touched package.json.
# That is the natural shape for a repo that lands straight on main, and it worked until releasing
# became a standing automated job rather than something a human did while holding the whole tree in
# their head. The problem is that main moves under you: several agents land on it continuously, so the
# commit you verified and the commit that publishes are routinely not the same one, and a release
# carries whatever happened to arrive in between. Nobody chose to ship that work; it was simply
# adjacent.
#
# So the two questions are now separated. Main answers "has this landed?". `release` answers "has this
# been VERIFIED and chosen to ship?" — and only the second one publishes.
#
# THE BRANCH IS A FAST-FORWARD POINTER INTO MAIN, never a fork. It holds no commits of its own: you
# pick the main commit you actually tested and move `release` to it. That keeps the published tree a
# real snapshot of main with no merge to reconcile and nothing to cherry-pick, while still letting you
# leave later, unverified commits behind. If `release` ever needs a non-fast-forward push, something
# has gone wrong — stop and look rather than forcing it.
#
# THE CONSEQUENCE TO KNOW ABOUT: bumping the version on main and pushing NO LONGER PUBLISHES. It is
# inert until `release` is moved. That silence is deliberate, but it is silence, so the procedure lives
# in plans/runtime-pin-bumps.md and the check for an unshipped bump runs on the daily runtime watch.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN, no secret to rotate or leak. That binds the
# right to publish to THIS repository and THIS workflow file — the filename is load-bearing, and
# renaming release.yml breaks publishing until the trusted publisher is reconfigured on npmjs.com. It
# does NOT bind a branch (npm's trusted publisher takes org, repo, workflow filename and an optional
# environment, and this workflow declares no environment), which is what makes publishing from
# `release` work at all. Trusted publishing attaches provenance automatically; --provenance is
# unnecessary.

on:
  push:
    branches: [release]
    paths:
      - package.json
  # Lets a failed or interrupted release be retried without an empty version bump — and covers the
  # case where `release` moves across a range whose package.json diff the path filter does not see,
  # which is every branch-creation push and any fast-forward that lands the bump mid-range.
  workflow_dispatch:

# Two releases racing would fight over the same version; let an in-flight one finish rather than
# cancelling it mid-publish.
concurrency:
  group: release-frizz
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
      contents: write # tag the released commit and create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          # Without an explicit registry-url npm has no registry to exchange the OIDC token against.
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1. Node 26 ships a new enough npm today; upgrading
      # explicitly keeps this workflow correct if the bundled npm ever regresses.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # A release must not be the first time the tree is compiled. The full suite is deliberately NOT
      # a gate here: it drives real provider CLIs and has never run on a CI box, so making it block
      # publishing would break releases for reasons unrelated to the release. (It used to drive tmux
      # too; that transport is gone.)
      - name: Typecheck
        run: pnpm run typecheck

      - name: Resolve version and decide whether to publish
        id: decide
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Ask the registry rather than diffing commits: idempotent, so a re-run, a revert-and-reland,
          # or a workflow_dispatch can never double-publish or fail on an already-released version.
          if npm view "frizz@$VERSION" version > /dev/null 2>&1; then
            echo "frizz@$VERSION is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "frizz@$VERSION is not on the registry; publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds web-dist, the esbuild bundles and the runtime closure, then strips pnpm's
      # workspace: specifiers from the manifest; postpack restores the checked-in file.
      - name: Publish to npm
        if: steps.decide.outputs.publish == 'true'
        run: npm publish

      # The two steps below are deliberately NOT gated on `publish`, and each checks for its own
      # artifact instead. Publishing is only the first of three things a release does, and the moment
      # npm accepts the tarball `publish` is false forever after — so gating these on it meant the
      # workflow_dispatch retry promised above could never repair a release that died AFTER the
      # publish. That is not hypothetical: v0.4.0 reached npm and was tagged, then `gh release create`
      # got a 503 from the API, and re-running the workflow would have skipped straight past the one
      # step that had failed. Checking for the tag and the release makes a retry finish the job and
      # makes a re-run on an already-complete release a no-op.
      - name: Tag the released commit
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already tagged; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "frizz v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "the v$VERSION release already exists; nothing to do"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "frizz v$VERSION" \
            --notes "Published to npm: https://www.npmjs.com/package/frizz/v/$VERSION" \
            --verify-tag
