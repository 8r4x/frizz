<!doctype html>
<!-- `data-font="sans"` because the prose/UI font is a SETTING (lib/font.ts → html[data-font], applied in
     index.html before first paint) and a fixture that leaves it unset silently renders the MONO default. -->
<html lang="en" data-font="sans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>First-run fixture — the brand-new project's one screen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/first-run-fixture.tsx"></script>
  </body>
</html>
