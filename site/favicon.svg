      <stop offset="0" stop-color="#ffdf7f"/>
      <stop offset="0.62" stop-color="#eabe2c"/>
      <stop offset="1" stop-color="#cf9412"/>
    </radialGradient>
  </defs>

  <rect id="icon-background" x="16" y="16" width="480" height="480" rx="116" fill="url(#background)"/>
